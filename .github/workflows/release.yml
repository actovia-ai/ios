name: Release metadata

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the shared app and widget version
        run: scripts/set-version.sh --check

      - name: Test version preparation
        run: python3 -m unittest discover -s Tests/VersionScriptTests -v
